<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>table</title>
    <style>
      table,
      tr,
      td {
        border: 1px solid rgb(12, 12, 12);
      }
    </style>
  </head>
  <body>
    <table>
      <tr>
        <td>
          1 x 1 = 1 <br />
          1 x 2 = 2 <br />
          1 x 3 = 3 <br />
          1 x 4 = 4 <br />
          1 x 5 = 5 <br />
          1 x 6 = 6 <br />
          1 x 7 = 7 <br />
          1 x 8 = 8 <br />
          1 x 9 = 9 <br />
          1 x 10 = 10 <br />
        </td>
        <td>2</td>
        <td>3</td>
        <td>4</td>
        <td>5</td>
      </tr>
      <tr>
        <td>6</td>
        <td>7</td>
        <td>8</td>
        <td>9</td>
        <td>10</td>
      </tr>
    </table>
  </body>
</html>
